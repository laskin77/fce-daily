<title>FCE 每日英文</title>
<script>
/* =====================================================================
 LESSON SCHEMA (swap only this object for a new lesson)
 {
  date: "YYYY-MM-DD",            // used for localStorage key + completion code
  topic: "string",               // English topic title
  topicZh: "string",             // 中文主題
  minutes: 8,                    // timer length (target 7-8 min)
  speaking: {                   // REQUIRED only when idol is absent; if LESSON.idol is present this step is SKIPPED (may be omitted)
    part: "Part 1" | "Part 2",
    prompt: "string",            // examiner question / task
    followUps: ["string"],       // optional, keep 0-1 (1 prompt only)
    modelAnswer: "string",       // max ~4 sentences
    tipZh: "string",             // 中文提示
    phrases: [{ en, zh }]        // 3 useful phrases
  },
  vocab: [{ word, pos, zh, example }],   // 5 items, flip cards; flips required = vocab.length
  grammar: {
    title: "string", explanationZh: "string",
    examples: [{ en, noteZh }],          // 3-4
    practice: [{ q, options:[..], answer: index, explanationZh }]
         // OPTIONAL, 1 item: UNSCORED quick checks in 學習 step 3 (instant feedback).
         // If omitted/empty, step 3 just requires a '我看懂了' tap.
  },
  useOfEnglish: {
    type: "Part 1" | "Part 2", instructionZh: "string",
    text: "string with gaps marked {1} {2} ...",
    gaps: [{ n, options: [..] (Part 1) , answer: "string", explanationZh }]   // 4 gaps; score shown uoe:X/gaps.length
         // Part 2 (open cloze): omit options; learner types
  },
  idol: {                        // OPTIONAL step "原聲跟讀" (跟偶像學英文). Present → it REPLACES 口說 (both are listen-then-repeat)
                                 // and becomes step 1 (~2-3 min). Omit → step skipped, 口說 is step 1 as before.
    person: "Tsai Ing-wen" | "Hsiao Bi-khim" | "Puma Shen",
    personZh: "蔡英文",            // optional display name
    introZh: "string",           // 1-3 句真實背景 + 這段話的場合（日期、地點）
    excerpt: "string",           // REAL verbatim English, 2-3 real sentences (~20-30 s of speech); "…" marks cuts. NEVER invented.
    sourceUrl: "https://...",    // official transcript (curl-verified 200)
    sourceLabel: "string",       // optional, e.g. "總統府英文網站逐字稿"
    videoUrl: "https://...",     // OPTIONAL YouTube link
    videoNote: "string",         // OPTIONAL, e.g. "新聞剪輯，未確認包含此句"
    clip: { youtubeId: "hoFt7V1omaU", start: 244, end: 256 },  // OPTIONAL but preferred: the idol's REAL voice.
                                 // Seconds (integers ok) on that YouTube video where the excerpt is spoken.
                                 // Present → step embeds a youtube-nocookie player (playsinline, iPad-safe)
                                 // playing only start→end, + 🔁 replay; 'next' unlocks once it was played/tapped.
                                 // Absent → TTS fallback, clearly labeled 電腦發音. NEVER synthesize/clone a real voice.
                                 // Timestamps must be verified (captions via yt-dlp or transcribed audio).
    chunks: [{ text, say, start, end }],  // 3-4 shadowing chunks, each with real-voice start/end. text may mark stress with *word* and pauses / or //;
                                 // start/end (seconds, OPTIONAL, same clip video) → chunk ▶ replays that bit in the real voice;
                                 // say = plain text for TTS fallback only (optional; defaults to text with marks stripped)
    phrases: [{ en, zh, example }],  // exactly 2
    respond: { promptEn, promptZh, starters: ["string"] }  // OPTIONAL short speaking response: FCE-style question tied
                                 // to the clip; Roby answers aloud in 1-2 sentences (2-3 starters). Not required to unlock.
  },
  quiz: [{ id:"q1", q, options:[4], answer: index(0-3), explanationZh }]  // 6 (may include 1 on the idol excerpt)
 }
 FLOW: guided learning, one step at a time: 1 = 原聲跟讀 if LESSON.idol (done after ≥1 ▶ play) ELSE 口說 → 單字 (flip all cards) → 3 文法 (+practice)
 → 4 Use of English (scored, all gaps answered) → 測驗 unlocks (locked 🔒 before that).
 Learning progress saved in localStorage (same per-date key); 重做 clears everything.
 SCORING: all counts come from array lengths. Live header shows quiz 得分 X / quiz.length;
 Use of English shown X / gaps.length. score 0-100 = round((quizCorrect+uoeCorrect)/(quiz.length+gaps.length)*100).
 Completion code: FCE-<date> quiz:<X>/<quiz.length> uoe:<Y>/<gaps.length> score:<0-100> missed:q3,q7  (or missed:none)
 e.g. FCE-2026-10-23 quiz:5/6 uoe:3/4 score:80 missed:q2
 ASSET: header + end screen use relative image "assets/monkey.jpg" (must exist next to the html).
===================================================================== */
const LESSON = {
 "date": "2026-10-26",
 "topic": "Helping others & pronoun traps it / one / some / any / mine",
 "topicZh": "互相幫助＋代名詞陷阱 it / one / some / any / mine",
 "minutes": 8,
 "idol": {
  "person": "Tsai Ing-wen",
  "personZh": "蔡英文",
  "introZh": "2021 年 5 月 10 日，蔡英文總統以視訊在丹麥的「哥本哈根民主高峰會」（Copenhagen Democracy Summit）用英文演講。這段她談到台灣的防疫經驗，以及感謝世界各地的朋友。影片是她本人的原音。",
  "excerpt": "Taiwan's response to COVID-19 shows how pandemics can be contained without curtailing democratic freedoms. We are fortunate to have many friends in government, the media, and organizations across the world who have highlighted our pandemic response, as well as what Taiwan can do for the world.",
  "sourceUrl": "https://english.president.gov.tw/NEWS/6125",
  "sourceLabel": "總統府英文網站逐字稿（原音說 across the world，逐字稿寫 across the globe，跟讀以原音為準）",
  "videoUrl": "https://www.youtube.com/watch?v=M6-KFxp7Nrk&t=289s",
  "videoNote": "Alliance of Democracies 官方 YouTube，4:49 起為本人原音；文字依 YouTube 字幕與總統府逐字稿核對",
  "clip": {
   "youtubeId": "M6-KFxp7Nrk",
   "start": 289.8,
   "end": 314.3
  },
  "chunks": [
   {
    "text": "Taiwan's *response* to COVID-19 shows how pandemics can be *contained* /",
    "say": "Taiwan's response to COVID-19 shows how pandemics can be contained",
    "start": 289.8,
    "end": 295.3
   },
   {
    "text": "without *curtailing* democratic *freedoms*. //",
    "say": "without curtailing democratic freedoms.",
    "start": 295.3,
    "end": 299.5
   },
   {
    "text": "We are *fortunate* to have many friends / in government, the media, and organizations / across the world /",
    "say": "We are fortunate to have many friends in government, the media, and organizations across the world",
    "start": 299.5,
    "end": 307.0
   },
   {
    "text": "who have *highlighted* our pandemic response, / as well as what Taiwan *can do* for the world. //",
    "say": "who have highlighted our pandemic response, as well as what Taiwan can do for the world.",
    "start": 307.0,
    "end": 314.3
   }
  ],
  "phrases": [
   {
    "en": "We are fortunate to have …",
    "zh": "我們很幸運能擁有……",
    "example": "We are fortunate to have such patient teachers at our school."
   },
   {
    "en": "as well as …",
    "zh": "以及……、還有……（比 and 正式）",
    "example": "She plays the piano as well as the violin."
   }
  ],
  "respond": {
   "promptEn": "Think of a time when someone helped you, or you helped someone in need. What happened? Answer in one sentence.",
   "promptZh": "想一想：有人幫過你，或你幫助過需要幫忙的人嗎？發生了什麼事？用一句英文回答。（可以用 I was fortunate to have… 或 I once helped… who was in need.）",
   "starters": [
    "I was fortunate to have …",
    "I once helped a classmate who was in need …",
    "I'm really grateful to … for …"
   ]
  }
 },
 "vocab": [
  {
   "word": "contain",
   "pos": "v.",
   "zh": "控制住、阻止擴散；包含",
   "example": "The firefighters contained the fire before it reached the forest."
  },
  {
   "word": "fortunate",
   "pos": "adj.",
   "zh": "幸運的",
   "example": "I was fortunate to get the last ticket for the concert."
  },
  {
   "word": "highlight",
   "pos": "v. / n.",
   "zh": "強調、使受注目；精彩片段",
   "example": "The report highlighted the importance of washing your hands."
  },
  {
   "word": "in need",
   "pos": "phr.",
   "zh": "有需要的、處境困難的",
   "example": "Our class collected old clothes for families in need."
  },
  {
   "word": "grateful",
   "pos": "adj.",
   "zh": "感激的",
   "example": "I'm grateful to my sister for helping me with my science project."
  }
 ],
 "grammar": {
  "title": "代名詞陷阱：it / one / some / any / mine（指「同一個」還是「同類的」？）",
  "explanationZh": "會考低答對率題型（110 會考 find any 答對率只有 41%）。先問自己：空格指的是「哪一個」？\n① it＝前面說過的「那一個、同一個」東西。Can I use yours? — I'm not using it now.（就是那塊橡皮擦）\n② one＝同類的「任一個」（＝a/an＋名詞）；複數用 ones，或用 some。I lost my pen. Can I borrow one?（任何一支筆都好）\n③ some 用在肯定句、提供／請求（Would you like some…? / Can I check… for some tools?）；any 用在否定、疑問、if / whether 後面：See if you can find any.（不確定裡面有沒有 → any）\n④ mine / yours / hers＝「my＋名詞」，本身就是主詞或受詞，後面不能再接名詞。I want another dentist because mine (＝my dentist) pulled out a good tooth.\n🔑 判斷法：同一個 → it；同類任一個 → one；不確定有沒有 → any；「我的那個」→ mine。\n⭐ B2 加分：any 也可以用在肯定句，表示「隨便哪一個都行」：Any student can join the club.",
  "examples": [
   {
    "en": "Tom: I need an eraser. Can I use yours? Judy: Sure. I'm not using it now.",
    "noteZh": "110 補考：yours＝Judy 的橡皮擦 → 同一塊 → it"
   },
   {
    "en": "My phone is broken, so I'm going to buy a new one.",
    "noteZh": "one＝同類的另一支手機（不是原本那支，所以不用 it）"
   },
   {
    "en": "Can I check your drawer for some tools? — Sure. See if you can find any in there.",
    "noteZh": "110 會考：if（是否）後面不確定有沒有 → any；前面請求句用 some"
   }
  ],
  "practice": [
   {
    "q": "I've lost my umbrella, and it's raining hard. Can you lend me ___?",
    "options": [
     "it",
     "any",
     "mine",
     "one"
    ],
    "answer": 3,
    "explanationZh": "umbrella 弄丟了，要借的是「同類的任一把傘」→ one。it 會變成「借我那把（已經弄丟的）傘」；mine 是「我的」，不能叫別人借你「我的」；any 單獨用在這裡不自然（要說 any umbrella）。"
   }
  ]
 },
 "useOfEnglish": {
  "type": "Part 1",
  "instructionZh": "選出最適合每個空格的字（FCE Part 1 多選克漏字）。",
  "text": "When the typhoon hit the east coast, many families lost their homes. Our class wanted to help people {1} need, so we collected food and clothes. I couldn't find {2} old jackets in my closet, so I bought a new {3} instead. The organizer was very {4} for our help and later sent us a thank-you card.",
  "gaps": [
   {
    "n": 1,
    "options": [
     "on",
     "with",
     "in",
     "of"
    ],
    "answer": "in",
    "explanationZh": "people in need＝有需要的人（固定片語，放在名詞後面）。"
   },
   {
    "n": 2,
    "options": [
     "some",
     "it",
     "one",
     "any"
    ],
    "answer": "any",
    "explanationZh": "couldn't 是否定句 → any old jackets（一件都找不到）。some 用在肯定句；it / one 後面不能再接 old jackets。"
   },
   {
    "n": 3,
    "options": [
     "one",
     "it",
     "them",
     "mine"
    ],
    "answer": "one",
    "explanationZh": "a new one＝一件新的（同類的外套）。a new it / a new them / a new mine 都不合文法。"
   },
   {
    "n": 4,
    "options": [
     "fortunate",
     "grateful",
     "careful",
     "hopeful"
    ],
    "answer": "grateful",
    "explanationZh": "be grateful for＋事＝因為……而感激。fortunate 是「幸運的」，不接 for our help；careful、hopeful 意思不合。"
   }
  ]
 },
 "quiz": [
  {
   "id": "q1",
   "q": "Nora: Can I check your drawer for some tools we can use?\nMatt: Sure. Take a look. See if you can find ___ in there.",
   "options": [
    "it",
    "others",
    "any",
    "those"
   ],
   "answer": 2,
   "explanationZh": "See if＝看看是否 → 不確定抽屜裡有沒有工具 → any（任何可用的工具）。it 指特定一個；others / those 前面沒有對照或特定對象。全國答對率只有約 41%！"
  },
  {
   "id": "q2",
   "q": "Tom: I need an eraser. Can I use yours?\nJudy: Sure. I'm not using ___ now.",
   "options": [
    "it",
    "another",
    "each",
    "yours"
   ],
   "answer": 0,
   "explanationZh": "Tom 要借的就是 Judy 的那塊橡皮擦 → 同一個東西 → it。another＝另一個；each＝每一個；yours＝你的（Judy 不會說「我沒在用你的」）。"
  },
  {
   "id": "q3",
   "q": "I want to find another dentist because ___ pulled out a good tooth last time I went to him.",
   "options": [
    "I",
    "me",
    "myself",
    "mine"
   ],
   "answer": 3,
   "explanationZh": "拔錯好牙的是「我的牙醫」→ mine＝my dentist，當主詞。I 不會自己拔牙還去找 him；me 是受詞、myself 是反身代名詞，都不能當這裡的主詞。"
  },
  {
   "id": "q4",
   "q": "The doctors worked day and night to ___ the disease, so it did not spread to other cities.",
   "options": [
    "contact",
    "contain",
    "continue",
    "complain"
   ],
   "answer": 1,
   "explanationZh": "so it did not spread＝沒有擴散 → 把疾病「控制住」→ contain。contact 聯絡、continue 繼續、complain 抱怨：長得像但意思完全不同（會考常考的形近字陷阱）。"
  },
  {
   "id": "q5",
   "q": "I was ___ to get the last ticket. The man behind me had to go home without one.",
   "options": [
    "careful",
    "curious",
    "fortunate",
    "nervous"
   ],
   "answer": 2,
   "explanationZh": "買到最後一張票、後面的人沒買到 → 我很「幸運」→ fortunate。順便注意 without one：one＝a ticket（同類的任一張）。"
  },
  {
   "id": "q6",
   "q": "In the clip, what does Tsai Ing-wen say Taiwan's response to COVID-19 shows?",
   "options": [
    "Pandemics can only be stopped by closing all schools.",
    "Pandemics can be contained without curtailing democratic freedoms.",
    "Taiwan does not need any friends to fight a pandemic.",
    "Freedom is less important than health."
   ],
   "answer": 1,
   "explanationZh": "原句：Taiwan's response to COVID-19 shows how pandemics can be contained without curtailing democratic freedoms.（疫情可以在不限縮民主自由的情況下被控制住。）"
  }
 ]
};
</script>

.ex b,.gq>b{font-family:var(--serif);font-weight:400;font-size:1.04rem}
.uoetext{font-family:var(--serif);font-size:1.08rem;line-height:2.1}
.gap{display:inline-block;min-width:3.2em;text-align:center;color:var(--mute);border-bottom:1.2px solid var(--brown);border-radius:0 0 40% 60%/0 0 3px 2px;padding:0 4px;line-height:1.5}
.gap.ok{color:var(--sage);border-color:var(--sage)}
.gap.bad{color:var(--brown);font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.opt{text-align:left;border-color:rgba(107,74,53,.35);color:var(--ink);padding:10px 14px}
.opt.ok{border-color:var(--sage);background:rgba(138,154,123,.18);color:var(--ink)}
.opt.bad{border-color:var(--brown);background:rgba(107,74,53,.1);text-decoration:line-through;text-decoration-color:rgba(107,74,53,.6)}
.fb{font-size:.9rem;padding:8px 2px 4px;color:var(--mute)}
.fb.ok b{color:var(--sage)} .fb.bad b{color:var(--brown)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;font-size:.85rem;color:var(--mute)}
.qscore{font-family:var(--serif);color:var(--brown);font-size:1.1rem;letter-spacing:.05em}
.bar{height:3px;background:rgba(107,74,53,.13);border-radius:3px;overflow:hidden;margin:8px 0 26px}
.bar>div{height:100%;background:var(--sage);width:0;transition:width .3s}
.gq{margin-bottom:26px}
.endart{width:150px;height:110px;margin:0 auto;background:url(assets/monkey.jpg) no-repeat center 81%/auto 260px;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(closest-side,#000 65%,transparent);mask-image:radial-gradient(closest-side,#000 65%,transparent)}
.score{font-family:var(--serif);text-align:center;color:var(--brown);font-size:4.6rem;line-height:1;margin:16px 0 4px;letter-spacing:.02em}
.score small{font-size:1.2rem;color:var(--mute)}
.scorelbl{text-align:center;text-transform:uppercase;letter-spacing:.3em;font-size:.72rem;color:var(--mute);font-family:var(--serif)}
.subscores{display:flex;justify-content:center;gap:36px;margin:22px 0 10px;text-align:center}
.subscores div{font-family:var(--serif);font-size:1.5rem;color:var(--ink)}
.subscores span{display:block;font-family:var(--sans);font-size:.78rem;color:var(--mute);letter-spacing:.1em}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.88rem;background:rgba(232,225,208,.6);color:var(--ink);padding:12px 14px;border:1px dashed rgba(107,74,53,.45);border-radius:var(--wob);word-break:break-all;margin:10px 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.hidden{display:none}
input{font:inherit;padding:8px 4px;border:none;border-bottom:1.2px solid var(--brown);background:transparent;color:var(--ink);border-radius:0;outline:none}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;max-width:760px;margin:8px auto 0;font-size:.8rem}
.steps button{padding:2px 10px;font-size:.8rem;border-color:rgba(107,74,53,.35);color:var(--mute)}
.steps button.done{border-color:var(--sage);color:var(--sage)}
.steps button.cur{background:var(--brown);color:var(--paper);border-color:var(--brown)}
.steps button.locked{opacity:.5;border-style:dashed}
.yt{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}.yt>div,.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stress{color:var(--brown);text-decoration:underline wavy var(--sage);font-weight:400}
.steps .arr{color:var(--mute)}
.steplbl{text-align:center;font-family:var(--serif);color:var(--brown);letter-spacing:.12em;font-size:.85rem;margin-top:4px}
.next{margin-top:26px;width:100%}
button.solid:disabled{opacity:.4}
.lock{text-align:center;padding:40px 10px;font-size:1.05rem;color:var(--brown);border:1.2px dashed rgba(107,74,53,.45);border-radius:var(--wob)}
.req{font-size:.85rem;color:var(--sage);margin-top:10px}
section.step-hide{display:none}
@media(max-width:480px){.opts{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:12px}.flip{height:220px}.art{height:150px}h1{letter-spacing:.22em;font-size:1.1rem}.score{font-size:3.8rem}}
@media(min-width:768px){main{padding-left:40px;padding-right:40px}.art{height:200px;background-size:auto 440px}}
</style>
</head>
<body>
<div class="hero"><div class="art" role="img" aria-label="monkey reading a book"></div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
<header><div class="hrow">
  <div class="live" id="live">得分 <b id="liveScore">0</b> / ?</div>
  <div class="timer"><span class="time" id="time"></span><button class="sm solid" id="tbtn">開始</button><button class="sm ghost" id="treset">重設</button></div>
</div>
<nav class="steps" id="steps"></nav><div class="steplbl" id="steplbl"></div></header>
<main>
  <section id="s-speak"></section>
  <section id="s-idol"></section>
  <section id="s-vocab"></section>
  <section id="s-gram"></section>
  <section id="s-uoe"></section>
  <section id="s-lock"></section>
  <section id="s-quiz"></section>
  <section id="s-end" class="hidden"></section>
</main>
<script>
(function(){
const L = LESSON, $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = 'fce-lesson-' + L.date;
let state = {}; try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
state.quiz = state.quiz || {}; state.uoe = state.uoe || {};
state.learn = state.learn || {}; const LN = state.learn;
LN.flipped = LN.flipped || []; LN.practice = LN.practice || {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };

/* speech */
let voice = null;
function pickVoice(){ const vs = window.speechSynthesis ? speechSynthesis.getVoices() : []; voice = vs.find(v=>v.lang==='en-GB') || vs.find(v=>/^en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t){ if(!window.speechSynthesis){ alert('此瀏覽器不支援語音朗讀'); return; } speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang='en-GB'; if(voice) u.voice=voice; u.rate=0.92; speechSynthesis.speak(u); }
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if(b){ e.stopPropagation(); speak(b.getAttribute('data-say')); } });

/* header + timer */
$('title').textContent = 'FCE · ' + L.date; document.title = `FCE 每日 ${L.minutes||8} 分鐘英文`;
$('subtitle').textContent = L.topic + '｜' + L.topicZh;
let left = state.timeLeft != null ? state.timeLeft : (L.minutes||8)*60, tid = null;
const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
function drawT(){ $('time').textContent = fmt(left); $('time').classList.toggle('done', left<=0); }
$('tbtn').onclick = () => { if(tid){ clearInterval(tid); tid=null; $('tbtn').textContent='繼續'; return; }
  if(left<=0) return; $('tbtn').textContent='暫停';
  tid = setInterval(()=>{ left--; state.timeLeft=left; drawT(); if(left%5===0) save(); if(left<=0){ clearInterval(tid); tid=null; $('tbtn').textContent='時間到'; save(); } },1000); };
$('treset').onclick = () => { clearInterval(tid); tid=null; left=(L.minutes||8)*60; state.timeLeft=left; save(); $('tbtn').textContent='開始'; drawT(); };
drawT();

/* 1 speaking (skipped when idol present) */
if (!L.idol) {
const S = L.speaking;
$('s-speak').innerHTML = `<h2><span class="t">I · 口說 Speaking</span> <span class="badge">${esc(S.part)}</span></h2>
<div class="prompt">${esc(S.prompt)} <button class="sm ghost" data-say="${esc(S.prompt)}">🔊</button></div>
${(S.followUps||[]).length?`<p class="zh">延伸問題：</p><ul>${S.followUps.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
<p class="zh">💡 ${esc(S.tipZh||'')}</p>
<p class="zh">先自己大聲回答一次（約 30 秒），再看範例。</p>
<h3>範例回答</h3>
<div class="model" id="model"><p>${esc(S.modelAnswer)}</p><div class="btns"><button class="sm" id="listenModel" data-say="${esc(S.modelAnswer)}">🔊 聆聽範例</button><button class="sm ghost" id="readAloud">🗣 我唸過了</button></div></div>
<h3>實用句型</h3>
<ul class="phr">${S.phrases.map(p=>`<li><div><b>${esc(p.en)}</b><div class="zh">${esc(p.zh)}</div></div><button class="sm ghost" data-say="${esc(p.en)}">🔊</button></li>`).join('')}</ul>
<button class="ghost sm" data-say="${esc(S.phrases.map(p=>p.en).join('. '))}">🔊 全部句型</button>`;
$('s-speak').insertAdjacentHTML('beforeend', `<div class="req" id="speakReq"></div><button class="solid next" id="next1">學會了，下一步</button>`);
function drawSpeak(){ const ok = !!(LN.listened||LN.readAloud); $('next1').disabled = !ok;
  $('speakReq').textContent = ok ? '✓ 已完成：' + (LN.listened?'聽過範例 ':'') + (LN.readAloud?'唸過範例':'') : '請先聆聽範例一次，或大聲唸完範例後點「我唸過了」。'; }
$('listenModel').addEventListener('click', ()=>{ LN.listened = true; save(); drawSpeak(); });
$('readAloud').onclick = () => { LN.readAloud = true; save(); drawSpeak(); };
$('next1').onclick = () => { LN.s1 = true; save(); goId(L.idol?'s-idol':'s-vocab'); };
drawSpeak();
} else $('s-speak').remove();

/* 1 idol (optional) */
const I = L.idol;
if (I) {
  const mark = t => esc(t).replace(/\*([^*]+)\*/g,'<b class="stress">$1</b>');
  const plain = t => String(t).replace(/\*/g,'').replace(/\s*\/+\s*/g,' ').replace(/\s+/g,' ').trim();
  const ch = (I.chunks||[]).map(c => typeof c==='string' ? {text:c} : c);
  const C = (I.clip && I.clip.youtubeId) ? I.clip : null;
  const ytSrc = (st,en,ap) => C ? `https://www.youtube-nocookie.com/embed/${encodeURIComponent(C.youtubeId)}?start=${Math.floor(st)}&end=${Math.ceil(en)}&playsinline=1&rel=0&modestbranding=1${ap?'&autoplay=1':''}` : '';
  $('s-idol').innerHTML = `<h2><span class="t">I · 原聲跟讀 Learn from your idol</span> <span class="badge">${esc(I.personZh||'')} ${esc(I.person)}</span></h2>
<p class="zh">${esc(I.introZh||'')}</p>
<div class="prompt">${esc(I.excerpt)}</div>
<p class="zh" style="font-size:.8rem">✅ 真實原話，逐字稿來源：<a href="${esc(I.sourceUrl)}" target="_blank" rel="noopener" style="color:var(--brown)">${esc(I.sourceLabel||I.sourceUrl)}</a>${I.videoUrl?`<br>▶ <a href="${esc(I.videoUrl)}" target="_blank" rel="noopener" style="color:var(--brown)">看原影片</a>${I.videoNote?'（'+esc(I.videoNote)+'）':''}`:''}</p>
${C?`<h3>🎧 聽本人原音 Real voice</h3><div class="yt"><div id="ytP"><iframe src="${ytSrc(C.start,C.end,0)}" title="${esc(I.person)} video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen playsinline></iframe></div></div>
<div class="btns" style="margin-top:8px"><button class="sm idolclip" data-s="${+C.start}" data-e="${+C.end}">🔁 重播原音</button></div>`:''}
<h3>跟讀 Shadowing</h3><p class="zh">${C?'按 ▶ 聽本人原音的那一段，馬上跟著唸。':'按 ▶ 聽一段（<b>電腦發音</b>，非本人聲音），馬上跟著唸。'}<b class="stress">粗體</b>＝重音，/＝短停，//＝長停。</p>
${ch.map(c=>{ const real = C && c.start!=null && c.end!=null;
  return `<div class="ex">${real?`<button class="sm idolplay idolclip" data-s="${+c.start}" data-e="${+c.end}">▶ 原音</button>`:`<button class="sm ghost idolplay" data-say="${esc(c.say||plain(c.text))}">▶ 電腦發音</button>`} <b>${mark(c.text)}</b></div>`; }).join('')}
<div class="btns" style="margin-top:10px">${C?`<button class="sm ghost idolplay idolclip" data-s="${+C.start}" data-e="${+C.end}">▶ 整段原音</button>`:`<button class="sm ghost idolplay" data-say="${esc(ch.map(c=>c.say||plain(c.text)).join(' '))}">▶ 整段（電腦發音）</button>`}</div>
<h3>偷學好句型</h3>
${(I.phrases||[]).map(p=>`<div class="ex"><b>${esc(p.en)}</b> <button class="sm ghost" data-say="${esc(p.example)}">🔊</button><div class="zh">${esc(p.zh)}</div><div style="font-style:italic">✏️ ${esc(p.example)}</div></div>`).join('')}
${I.respond?`<h3>🗣 換你說 Your turn</h3><div class="prompt">${esc(I.respond.promptEn)} <button class="sm ghost" data-say="${esc(I.respond.promptEn)}">🔊</button></div>
<p class="zh">${esc(I.respond.promptZh||'')}（大聲用 1–2 句回答，可用下面的開頭）</p>
<ul class="phr">${(I.respond.starters||[]).map(t=>`<li><div><b>${esc(t)}</b></div></li>`).join('')}</ul>`:''}
<div class="req" id="idolReq"></div><button class="solid next" id="nextI">學會了，下一步</button>`;
  const drawIdol = () => { $('nextI').disabled = !LN.idolPlayed; $('idolReq').textContent = LN.idolPlayed ? '✓ 已跟讀' : '請至少按一次 ▶ 播放並跟著唸。'; };
  const markPlayed = () => { if(!LN.idolPlayed){ LN.idolPlayed = true; save(); drawIdol(); } };
  $('s-idol').addEventListener('click', e => { if(e.target.closest('.idolplay,.idolclip')) markPlayed(); }, true);
  if (C) {
    // Real-voice clip: YouTube IFrame API when available; plain iframe (src swap) as fallback. Never TTS for the person.
    let yp = null, endT = null, poll = null;
    const playSeg = (st,en) => {
      if (window.speechSynthesis) speechSynthesis.cancel();
      if (yp && yp.loadVideoById) { endT = en; yp.loadVideoById({videoId:C.youtubeId, startSeconds:st, endSeconds:en}); }
      else { const h = $('ytP'), f = h && (h.tagName==='IFRAME' ? h : h.querySelector('iframe')); if (f) f.src = ytSrc(st,en,1); }
    };
    $('s-idol').addEventListener('click', e => { const b = e.target.closest('.idolclip'); if(b){ e.stopPropagation(); playSeg(+b.dataset.s, +b.dataset.e); } });
    const initYT = () => { try {
      yp = new YT.Player('ytP', { videoId: C.youtubeId, playerVars: { start: Math.floor(C.start), end: Math.ceil(C.end), playsinline: 1, rel: 0, modestbranding: 1 },
        host: 'https://www.youtube-nocookie.com',
        events: { onStateChange: ev => { if (ev.data === 1) { markPlayed();
            clearInterval(poll); poll = setInterval(()=>{ try { if(endT!=null && yp.getCurrentTime() >= endT){ yp.pauseVideo(); clearInterval(poll); } } catch(_){} }, 200); }
          else clearInterval(poll); } } });
      } catch(_) { yp = null; } };
    if (window.YT && YT.Player) initYT();
    else { const prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = () => { if(prev) prev(); initYT(); };
      const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc); }
  }
  $('nextI').onclick = () => { LN.si = true; save(); goId('s-vocab'); };
  drawIdol();
}

/* 2 vocab */
$('s-vocab').innerHTML = `<h2><span class="t">II · 單字 Vocabulary</span> <span class="badge">${L.vocab.length} 個</span></h2><p class="zh">點卡片翻面看中文與例句（每張都要翻過，也可以按 🔊 聆聽）。</p><div class="qscore" id="vprog" style="margin:0 0 14px"></div>
<div class="grid">${L.vocab.map((v,i)=>`<div class="flip" data-i="${i}"><div class="inner">
<div class="face"><div class="word">${esc(v.word)}</div><div class="pos">${esc(v.pos)}</div><button class="sm ghost" style="margin-top:10px" data-say="${esc(v.word)}">🔊</button></div>
<div class="face back"><div><b>${esc(v.word)}</b> <span class="zh">${esc(v.zh)}</span></div><div style="font-style:italic">${esc(v.example)}</div><button class="sm ghost" data-say="${esc(v.example)}">🔊 例句</button></div>
</div></div>`).join('')}</div>`;
$('s-vocab').insertAdjacentHTML('beforeend', `<button class="solid next" id="next2">學會了，下一步</button>`);
function drawVocab(){ const n = LN.flipped.length; $('vprog').textContent = `已學 ${n}/${L.vocab.length}`; $('next2').disabled = n < L.vocab.length;
  document.querySelectorAll('.flip').forEach(c => c.querySelector('.face').style.borderColor = LN.flipped.includes(+c.dataset.i) ? 'var(--sage)' : ''); }
document.querySelectorAll('.flip').forEach(c => c.onclick = () => { c.classList.toggle('on'); const i = +c.dataset.i; if(!LN.flipped.includes(i)){ LN.flipped.push(i); save(); } drawVocab(); });
$('next2').onclick = () => { LN.s2 = true; save(); goId('s-gram'); };
drawVocab();

/* 3 grammar */
const G = L.grammar, GP = (G.practice||[]).filter(q=>q&&q.options&&q.options.length);
$('s-gram').innerHTML = `<h2><span class="t">III · 文法 Grammar</span></h2><h3>${esc(G.title)}</h3><p>${esc(G.explanationZh)}</p>
${G.examples.map(x=>`<div class="ex"><b>${esc(x.en)}</b> <button class="sm ghost" data-say="${esc(x.en)}">🔊</button><div class="zh">${esc(x.noteZh)}</div></div>`).join('')}
${GP.length?`<h3>小練習（不計分）</h3>${GP.map((q,i)=>`<div class="gq" id="gp${i}"><b>${i+1}. ${esc(q.q)}</b><div class="opts">${q.options.map((o,j)=>`<button class="opt" data-p="${i}" data-j="${j}">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}</div><div class="fbx"></div></div>`).join('')}`:''}
<div class="req" id="gramReq"></div>${GP.length?'':'<button class="ghost" id="gotIt" style="margin-top:14px">👌 我看懂了</button>'}
<button class="solid next" id="next3">學會了，下一步</button>`;
function answerP(i,j){ const q=GP[i], box=$('gp'+i), ok=j===q.answer; LN.practice[i]=j; save();
  box.querySelectorAll('.opt').forEach((b,k)=>{ b.disabled=true; if(k===q.answer) b.classList.add('ok'); else if(k===j) b.classList.add('bad'); });
  box.querySelector('.fbx').innerHTML = `<div class="fb ${ok?'ok':'bad'}">${ok?'<b>✓ 正確</b>':'<b>✗ 正確答案：'+esc(q.options[q.answer])+'</b>'} ${esc(q.explanationZh||'')}</div>`; drawGram(); }
function gramOk(){ return GP.length ? GP.every((q,i)=>i in LN.practice) : !!LN.gotIt; }
function drawGram(){ const ok=gramOk(); $('next3').disabled=!ok; $('gramReq').textContent = ok?'✓ 完成':(GP.length?`完成 ${Object.keys(LN.practice).length}/${GP.length} 題小練習後即可繼續。`:'看完說明與例句後，點「我看懂了」。'); }
$('s-gram').addEventListener('click', e=>{ const b=e.target.closest('.opt'); if(b&&!b.disabled) answerP(+b.dataset.p,+b.dataset.j); });
if($('gotIt')) $('gotIt').onclick = () => { LN.gotIt = true; save(); drawGram(); };
$('next3').onclick = () => { LN.s3 = true; save(); goId('s-uoe'); };
Object.keys(LN.practice).forEach(i=>{ if(GP[i]) answerP(+i, LN.practice[i]); }); drawGram();

/* 4 use of english */
const U = L.useOfEnglish;
const txt = esc(U.text).replace(/\{(\d+)\}/g, (m,n)=>`<span class="gap" id="gap${n}">(${n})</span>`);
$('s-uoe').innerHTML = `<h2><span class="t">IV · Use of English</span> <span class="badge">${esc(U.type)}</span></h2><p class="zh">${esc(U.instructionZh)}</p><p class="uoetext">${txt}</p><div class="qscore" id="uprog" style="margin:6px 0 18px"></div>
${U.gaps.map(g=>`<div class="gq" id="ug${g.n}"><b>(${g.n})</b>${g.options?`<div class="opts">${g.options.map((o,i)=>`<button class="opt" data-n="${g.n}" data-v="${esc(o)}">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div>`:
`<div style="display:flex;gap:8px;margin:6px 0"><input data-n="${g.n}" autocapitalize="off" autocorrect="off" style="flex:1"><button class="sm" data-chk="${g.n}">檢查</button></div>`}<div class="fbx"></div></div>`).join('')}`;
function uoeScore(){ return U.gaps.filter(g=>g.n in state.uoe && String(state.uoe[g.n]).trim().toLowerCase()===g.answer.toLowerCase()).length; }
function uprog(){ const n=U.gaps.filter(g=>g.n in state.uoe).length; $('uprog').textContent = `Use of English 得分 ${uoeScore()} / ${U.gaps.length}` + (n<U.gaps.length?`（已作答 ${n}）`:'');
  const nb=$('next4'); if(nb){ nb.disabled = n<U.gaps.length; $('uoeReq').textContent = n<U.gaps.length ? `完成全部 ${U.gaps.length} 格後即可解鎖測驗（已作答 ${n}）。` : '✓ 完成，可以開始測驗了！'; } }
function answerGap(n, v){
  const g = U.gaps.find(x=>x.n==n); if(!g) return;
  const ok = v.trim().toLowerCase() === g.answer.toLowerCase();
  state.uoe[n] = v; save(); setTimeout(uprog);
  const box = $('ug'+n), gap = $('gap'+n);
  box.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(b.dataset.v===g.answer) b.classList.add('ok'); else if(b.dataset.v===v) b.classList.add('bad'); });
  const inp = box.querySelector('input'); if(inp){ inp.value=v; inp.disabled=true; }
  if(gap){ gap.textContent = g.answer; gap.classList.add(ok?'ok':'bad'); }
  box.querySelector('.fbx').innerHTML = `<div class="fb ${ok?'ok':'bad'}">${ok?'<b>✓ 正確</b>':'<b>✗ 正確答案：'+esc(g.answer)+'</b>'} ${esc(g.explanationZh||'')}</div>`;
}
$('s-uoe').addEventListener('click', e=>{ const b=e.target.closest('.opt'); if(b&&!b.disabled) answerGap(b.dataset.n,b.dataset.v);
  const c=e.target.closest('[data-chk]'); if(c){ const i=$('ug'+c.dataset.chk).querySelector('input'); if(i.value.trim()) answerGap(c.dataset.chk,i.value); } });
$('s-uoe').insertAdjacentHTML('beforeend', `<div class="req" id="uoeReq"></div><button class="solid next" id="next4">完成學習，開始測驗 →</button>`);
$('next4').onclick = () => { LN.s4 = true; save(); goId('s-quiz'); };
Object.keys(state.uoe).forEach(n=>answerGap(n,state.uoe[n])); uprog();

/* 5 quiz */
const Q = L.quiz;
$('s-quiz').innerHTML = `<h2><span class="t">V · 小測驗 Quiz</span></h2><div class="qhead"><span id="qprog"></span><span class="qscore" id="qscore"></span></div><div class="bar"><div id="qbar"></div></div>
${Q.map((q,i)=>`<div class="gq" id="qq${i}"><b>${i+1}. ${esc(q.q)}</b><div class="opts">${q.options.map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}</div><div class="fbx"></div></div>`).join('')}
<button id="finish" class="solid" style="width:100%">完成並查看結果</button>`;
function answerQ(i, j){
  const q = Q[i], box = $('qq'+i), ok = j===q.answer;
  state.quiz[q.id] = j; save();
  box.querySelectorAll('.opt').forEach((b,k)=>{ b.disabled=true; if(k===q.answer) b.classList.add('ok'); else if(k===j) b.classList.add('bad'); });
  box.querySelector('.fbx').innerHTML = `<div class="fb ${ok?'ok':'bad'}">${ok?'<b>✓ 正確</b>':'<b>✗ 正確答案：'+esc(q.options[q.answer])+'</b>'} ${esc(q.explanationZh)}</div>`;
  prog();
}
function prog(){ const n = Q.filter(q=>q.id in state.quiz).length; $('qprog').textContent = `進度 ${n}/${Q.length}`; $('qbar').style.width = (n/Q.length*100)+'%'; const c = Q.filter(q=>state.quiz[q.id]===q.answer).length; $('qscore').textContent = `得分 ${c} / ${Q.length}`; $('liveScore').textContent = c; $('live').lastChild.textContent = ' / ' + Q.length; if(n===Q.length) showEnd(); }
$('s-quiz').addEventListener('click', e=>{ if(!quizUnlocked()) return; const b=e.target.closest('.opt'); if(b&&!b.disabled) answerQ(+b.dataset.q, +b.dataset.j); });
Q.forEach((q,i)=>{ if(q.id in state.quiz) answerQ(i, state.quiz[q.id]); }); prog();
$('finish').onclick = () => { if(!quizUnlocked()) return; showEnd(); $('s-end').scrollIntoView({behavior:'smooth'}); };

/* guided steps */
const STEPS = [null, I?{id:'s-idol',n:'原聲跟讀',k:'si'}:{id:'s-speak',n:'口說',k:'s1'}].concat([{id:'s-vocab',n:'單字',k:'s2'},{id:'s-gram',n:'文法',k:'s3'},{id:'s-uoe',n:'閱讀',k:'s4'},{id:'s-quiz',n:'測驗'}]);
const QS = STEPS.length-1;  // quiz step number
if(!I) $('s-idol').remove();
function unlocked(k){ return k===1 || (k>1 && k<=QS && !!LN[STEPS[k-1].k] && unlocked(k-1)); }
const quizUnlocked = () => unlocked(QS);
function goId(id){ go(STEPS.findIndex(s=>s&&s.id===id)); }
const learnNames = STEPS.slice(1,QS).map(s=>s.n).join('、');
$('s-lock').innerHTML = `<div class="lock">🔒 先完成學習才能測驗<div class="zh" style="margin-top:8px">依序完成 學習 1–${QS-1}（${learnNames}）後，小測驗才會解鎖。</div></div>`;
function go(k, noScroll){
  if(!unlocked(k)) return;
  LN.step = k; save();
  for(let i=1;i<=QS;i++){ $(STEPS[i].id).classList.toggle('step-hide', i!==k); }
  $('s-lock').classList.toggle('step-hide', true);
  $('s-end').classList.toggle('step-hide', k!==QS);
  drawSteps(); if(!noScroll) window.scrollTo(0, Math.max(0, $('steps').getBoundingClientRect().top + window.scrollY - 120));
}
function drawSteps(){
  const cur = LN.step||1;
  $('steps').innerHTML = STEPS.slice(1).map((s,i)=>{ const k=i+1, lock=!unlocked(k), done=k<QS?!!LN[s.k]:!!state.completedAt;
    return `${k===QS?'<span class="arr">→</span>':''}<button class="${k===cur?'cur':''} ${done?'done':''} ${lock?'locked':''}" data-step="${k}" ${lock?'aria-disabled="true"':''}>${lock?'🔒 ':done?'✓ ':''}${k<QS?k+' ':''}${s.n}</button>`; }).join('');
  $('steplbl').textContent = cur<QS ? `學習 ${cur}/${QS-1} → 測驗` : '測驗 Quiz';
}
$('steps').addEventListener('click', e=>{ const b=e.target.closest('[data-step]'); if(!b) return; const k=+b.dataset.step;
  if(!unlocked(k)){ if(k===QS){ for(let i=1;i<=QS;i++) $(STEPS[i].id).classList.add('step-hide'); $('s-end').classList.add('step-hide'); $('s-lock').classList.remove('step-hide'); } return; }
  go(k); });
go(unlocked(LN.step||1) && (LN.step||1)<=QS ? (LN.step||1) : 1, true);
window.__fce = { unlocked, quizUnlocked, go, state };

/* end */
function showEnd(){
  const missed = Q.filter(q=>state.quiz[q.id]!==q.answer);
  const score = Q.length - missed.length, uo = uoeScore(), un = U.gaps.length, pts = Math.round((score+uo)/((Q.length+un)||1)*100);
  state.score = score; state.points = pts; state.uoeScore = uo; state.completedAt = state.completedAt || new Date().toISOString(); save();
  const code = `FCE-${L.date} quiz:${score}/${Q.length} uoe:${uo}/${un} score:${pts} missed:${missed.length?missed.map(q=>q.id).join(','):'none'}`;
  const uMiss = U.gaps.filter(g=>!(g.n in state.uoe) || String(state.uoe[g.n]).trim().toLowerCase()!==g.answer.toLowerCase());
  const e = $('s-end'); e.classList.remove('hidden');
  e.innerHTML = `<div class="endart" role="img" aria-label="monkey"></div><div class="scorelbl">Today's score</div>
<div class="score">${pts}<small> / 100</small></div>
<div class="subscores"><div>${score} / ${Q.length}<span>小測驗 Quiz</span></div><div>${uo} / ${un}<span>Use of English</span></div></div>
${missed.length?`<h3>需要複習的題目</h3><ul>${missed.map(q=>`<li><b>${esc(q.id)}</b> ${esc(q.q)}<br><span class="zh">${q.id in state.quiz?'你的答案：'+esc(q.options[state.quiz[q.id]])+'；':'未作答；'}正解：${esc(q.options[q.answer])}</span></li>`).join('')}</ul>`:'<p style="text-align:center">小測驗全對，太棒了！</p>'}
${uMiss.length?`<h3>Use of English 待複習</h3><ul>${uMiss.map(g=>`<li><b>(${g.n})</b> <span class="zh">${g.n in state.uoe?'你的答案：'+esc(state.uoe[g.n])+'；':'未作答；'}正解：${esc(g.answer)}</span></li>`).join('')}</ul>`:''}
<p class="zh">請複製以下完成碼，貼回家教聊天室：</p><div class="code" id="code">${esc(code)}</div>
<div class="btns"><button class="solid" id="copy">複製完成碼</button><button class="ghost" id="redo">重做今日課程</button></div>`;
  $('copy').onclick = () => { const done=()=>{$('copy').textContent='✓ 已複製';};
    if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(code).then(done,fallback); else fallback();
    function fallback(){ const t=document.createElement('textarea'); t.value=code; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); done();}catch(x){ alert(code); } t.remove(); } };
  $('redo').onclick = () => { if(confirm('確定要清除今日進度重新開始？')){ localStorage.removeItem(KEY); location.reload(); } };
}
})();
</script>
</body>
</html>
